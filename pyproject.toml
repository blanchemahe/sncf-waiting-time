[project]
name = "sncf-waiting-time"
version = "0.1.0"
description = "Streamlit app exploring platform waiting-time deviations on the SNCF Transilien network"
readme = "README.md"
authors = [
    { name = "Blanche Mahé" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "pandas>=3.0.6",
    "streamlit>=1.64.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
exclude-dependencies = ["nvidia-nccl-cu13"]
